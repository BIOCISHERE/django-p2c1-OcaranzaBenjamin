{% extends "base.html" %} {% block title %}Inicio | EcoEnergy{% endblock %} {% block content %}
<section class="py-3 py-lg-4">
    <div class="row align-items-center g-4">
        <div class="col-12 col-lg-7">
            <p class="text-uppercase text-success fw-semibold small mb-2">EcoEnergy</p>
            <h1 class="display-5 fw-bold mb-3">{{ mensaje }}</h1>
            <div class="d-flex flex-column flex-sm-row gap-3">
                <a href="{% url 'dispositivos:zonas' %}" class="btn btn-success btn-lg">Ver zonas</a>
                <a href="{% url 'dispositivos:catalogo' %}" class="btn btn-outline-success btn-lg">Ver dispositivos</a>
            </div>
        </div>

        <div class="col-12 col-lg-5">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 mb-0">Sistema</h2>
                        <span class="badge text-bg-success">Activo</span>
                    </div>
                    <p class="display-6 fw-semibold mb-2">{{ sistema }}</p>
                    <p class="text-body-secondary mb-0">Curso: {{ asignatura }}</p>
                    <p class="text-body-secondary mb-0">Autor: {{ autor }}</p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
